<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku Vui Nhộn 🧩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#EAF6FF;
    --bg-bot:#DDF3FF;
    --card:#FFFFFF;
    --ink:#2B2250;
    --ink-soft:#6B6390;
    --coral:#FF6B6B;
    --coral-dark:#E8534F;
    --yellow:#FFD93D;
    --yellow-dark:#F2B705;
    --green:#5FC98A;
    --green-dark:#3FA86A;
    --purple:#9B7BEC;
    --purple-dark:#7E5CD6;
    --blue:#4EA8DE;
    --lavender:#F1ECFF;
    --pink:#FFE3EC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Nunito',sans-serif;
    background:
      radial-gradient(circle at 10% 8%, #FFF7D6 0%, transparent 40%),
      radial-gradient(circle at 92% 15%, #FFE0EC 0%, transparent 35%),
      linear-gradient(180deg, var(--bg-top), var(--bg-bot));
    color:var(--ink);
    padding:20px 12px 60px;
  }
  .page-shell{
    width:100%;
    max-width:560px;
    margin:0 auto;
  }
  .app{
    width:100%;
  }

  .quiz-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:20px;
  }
  .quiz-brand{
    display:flex; align-items:center; gap:9px; color:var(--ink);
    font-family:'Baloo 2',sans-serif; font-size:18px; font-weight:800;
    text-decoration:none;
  }
  .brand-sun{
    width:38px; height:38px; display:grid; place-items:center;
    border:3px solid var(--ink); border-radius:50%; background:var(--yellow);
    font-family:'Nunito',sans-serif; font-size:12px;
    box-shadow:0 4px 0 rgba(43,34,80,.18);
  }
  .header-actions{ display:flex; align-items:center; gap:9px; min-width:0; }
  .mini-avatar{
    width:35px; height:35px; display:grid; place-items:center; flex:0 0 auto;
    border:2px solid #fff; border-radius:50%; background:#d9f5e6;
    color:#23765c; font-weight:900; box-shadow:0 0 0 1px #b9dfcf;
  }
  .header-name{
    max-width:130px; overflow:hidden; color:var(--ink); font-size:14px;
    font-weight:800; text-overflow:ellipsis; white-space:nowrap;
  }
  .logout-button{
    width:36px; height:36px; flex:0 0 auto; border:2px solid #e5e1f1;
    border-radius:12px; background:#fff; color:#77729b; cursor:pointer;
    font-family:'Nunito',sans-serif; font-size:17px; font-weight:900;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .logout-button:hover{ background:#fff0ec; border-color:#ffd0c7; color:#d45f4b; }
  .quiz-brand:focus-visible,
  .logout-button:focus-visible{ outline:4px solid rgba(255,217,61,.55); outline-offset:3px; }

  /* HERO */
  .hero{
    text-align:center;
    margin-bottom:14px;
    position:relative;
  }
  .mascot{
    font-size:52px;
    display:inline-block;
    animation:bob 2.6s ease-in-out infinite;
    filter:drop-shadow(0 6px 6px rgba(43,34,80,.15));
  }
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(-4deg);}
    50%{transform:translateY(-8px) rotate(4deg);}
  }
  h1{
    font-family:'Baloo 2',sans-serif;
    font-size:clamp(28px,7vw,38px);
    margin:2px 0 2px;
    color:var(--purple-dark);
    text-shadow:2px 2px 0 #fff, 4px 4px 0 rgba(155,123,236,.25);
  }
  .speech{
    display:inline-block;
    background:#fff;
    border:2px solid var(--lavender);
    border-radius:16px;
    padding:8px 16px;
    font-weight:700;
    font-size:14px;
    color:var(--ink-soft);
    box-shadow:0 4px 0 var(--lavender);
    margin-top:2px;
  }

  /* DIFFICULTY TABS */
  .tabs{
    display:flex;
    gap:8px;
    justify-content:center;
    margin:18px 0 14px;
  }
  .tab{
    font-family:'Baloo 2',sans-serif;
    font-size:15px;
    font-weight:700;
    padding:9px 18px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    background:#fff;
    color:var(--ink-soft);
    box-shadow:0 3px 0 #d9d4ef;
    transition:transform .12s ease;
  }
  .tab:active{transform:translateY(2px); box-shadow:0 1px 0 #d9d4ef;}
  .tab.active{
    background:var(--purple);
    color:#fff;
    box-shadow:0 3px 0 var(--purple-dark);
  }

  /* STATS BAR */
  .stats{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .pill{
    background:#fff;
    border-radius:14px;
    padding:8px 14px;
    font-weight:800;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:6px;
    box-shadow:0 3px 0 #e5e0f7;
    color:var(--ink);
  }

  /* BOARD */
  .board-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:16px;
  }
  .board-card{
    background:var(--card);
    border-radius:26px;
    padding:14px;
    box-shadow:0 10px 0 #d9d4ef, 0 14px 24px rgba(43,34,80,.15);
  }
  .board{
    display:grid;
    gap:9px;
    background:var(--purple-dark);
    padding:9px;
    border-radius:18px;
  }
  .box{
    display:grid;
    gap:2px;
    background:var(--purple-dark);
    border-radius:8px;
    --tint-bg:#fff;
  }
  .box.tint{ --tint-bg:#EAF1FF; }
  .cell{
    background:var(--tint-bg,#fff);
    border:none;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    cursor:pointer;
    user-select:none;
    transition:background .12s ease, transform .08s ease;
    position:relative;
  }
  .cell.given{
    background:var(--lavender);
    color:var(--purple-dark);
    cursor:default;
  }
  .cell.selected{ background:var(--yellow) !important; box-shadow:inset 0 0 0 2.5px var(--yellow-dark);}
  .cell.peer{ background:#FFF6DA; }
  .cell.sameval{ box-shadow:inset 0 0 0 2.5px var(--purple); }
  .cell.hint{ color:var(--blue); }
  .cell.wrong{ background:var(--pink) !important; color:var(--coral-dark); animation:shake .35s; }
  .cell.correctflash{ animation:pop .3s ease; }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }
  @keyframes pop{
    0%{transform:scale(1);}
    50%{transform:scale(1.15);}
    100%{transform:scale(1);}
  }

  /* PALETTE */
  .palette{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-bottom:16px;
    max-width:420px;
    margin-left:auto;
    margin-right:auto;
  }
  .sym-btn{
    width:52px;height:52px;
    border-radius:14px;
    border:none;
    background:#fff;
    font-size:24px;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 3px 0 #d9d4ef;
    color:var(--purple-dark);
    transition:transform .1s;
  }
  .sym-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 #d9d4ef; }

  /* ACTIONS */
  .actions{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .action-btn{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:15px;
    padding:11px 18px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    color:#fff;
    transition:transform .1s;
  }
  .action-btn:active{ transform:translateY(2px); }
  #newGameBtn{ background:var(--green); box-shadow:0 4px 0 var(--green-dark); }
  #hintBtn{ background:var(--blue); box-shadow:0 4px 0 #3B84B0; }
  #eraseBtn{ background:var(--coral); box-shadow:0 4px 0 var(--coral-dark); }
  #checkBtn{ background:var(--purple); box-shadow:0 4px 0 var(--purple-dark); }
  .action-btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* WIN OVERLAY */
  .win-overlay{
    position:fixed;
    inset:0;
    background:rgba(43,34,80,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .win-overlay.hidden{ display:none; }
  .win-card{
    background:#fff;
    border-radius:26px;
    padding:32px 26px;
    text-align:center;
    max-width:340px;
    box-shadow:0 12px 0 var(--yellow-dark);
    animation:pop .35s ease;
  }
  .win-card .big{ font-size:54px; }
  .win-card h2{
    font-family:'Baloo 2',sans-serif;
    color:var(--purple-dark);
    margin:6px 0;
    font-size:26px;
  }
  .win-card p{ color:var(--ink-soft); font-weight:700; margin:4px 0 18px; }
  .win-card button{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:16px;
    padding:12px 26px;
    border:none;
    border-radius:14px;
    background:var(--green);
    color:#fff;
    box-shadow:0 4px 0 var(--green-dark);
    cursor:pointer;
  }
  .confetti{
    position:fixed;
    top:-40px;
    font-size:24px;
    z-index:60;
    animation-name:fall;
    animation-timing-function:linear;
    animation-fill-mode:forwards;
    pointer-events:none;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(360deg); opacity:.2; }
  }

  footer{
    text-align:center;
    margin-top:22px;
    font-size:12px;
    color:var(--ink-soft);
    font-weight:600;
  }

  @media (max-width:380px){
    .quiz-brand{ font-size:16px; }
    .header-name{ max-width:72px; }
    .sym-btn{ width:46px;height:46px; font-size:20px; }
    .action-btn{ padding:10px 13px; font-size:13px; }
  }
</style>
</head>
<body>
<div class="page-shell">
<header class="quiz-header">
  <a class="quiz-brand" href="./" aria-label="Về trang chủ SunShinSon">
    <span class="brand-sun" aria-hidden="true">•ᴗ•</span>
    <span>SunShinSon</span>
  </a>
  <div class="header-actions">
    <div class="mini-avatar" id="headerAvatar" aria-hidden="true">B</div>
    <span class="header-name" id="headerName">Bé</span>
    <button class="logout-button" id="logoutButton" type="button" aria-label="Đăng xuất" title="Đăng xuất">↗</button>
  </div>
</header>
<div class="app">
  <div class="hero">
    <span class="mascot" id="mascot">🦊</span>
    <h1>Sudoku Vui Nhộn</h1>
    <div class="speech" id="speech">Chọn độ khó rồi bắt đầu chơi nhé!</div>
  </div>

  <div class="tabs">
    <button class="tab" data-level="easy">🐣 Dễ</button>
    <button class="tab" data-level="medium">🌟 Vừa</button>
    <button class="tab" data-level="hard">🔥 Khó</button>
  </div>

  <div class="stats">
    <div class="pill">⏱️ <span id="timer">00:00</span></div>
    <div class="pill">❌ <span id="mistakes">0</span></div>
    <div class="pill">💡 <span id="hintsLeft">3</span> gợi ý</div>
    <div class="pill">✅ <span id="checksLeft">5</span> lượt kiểm tra</div>
  </div>

  <div class="board-wrap">
    <div class="board-card">
      <div class="board" id="board"></div>
    </div>
  </div>

  <div class="palette" id="palette"></div>

  <div class="actions">
    <button class="action-btn" id="newGameBtn">🔄 Ván mới</button>
    <button class="action-btn" id="hintBtn">💡 Gợi ý</button>
    <button class="action-btn" id="eraseBtn">🧽 Xóa</button>
    <button class="action-btn" id="checkBtn">✅ Kiểm tra</button>
  </div>

  <footer>Chúc bé chơi vui! 🌈</footer>
</div>
</div>

<div class="win-overlay hidden" id="winOverlay">
  <div class="win-card">
    <div class="big">🏆</div>
    <h2>Bé giỏi quá!</h2>
    <p id="winStats">Hoàn thành trong 00:00 với 0 lỗi</p>
    <button id="playAgainBtn">Chơi lại 🎉</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  const gameUserName = (window.localStorage.getItem('sunshinson-name') || '').trim() || 'Bé';
  document.getElementById('headerName').textContent = gameUserName;
  document.getElementById('headerAvatar').textContent = gameUserName.charAt(0).toUpperCase();
  document.getElementById('logoutButton').addEventListener('click', () => {
    window.localStorage.removeItem('sunshinson-name');
    window.location.assign('./');
  });

  const LEVELS = {
    easy:   { size:4, boxH:2, boxW:2, remove:6,  symbols:["🐶","🐱","🐰","🐻"], mascotMsg:"Bé hãy tìm hình còn thiếu nhé!" },
    medium: { size:6, boxH:2, boxW:3, remove:17, symbols:["🐶","🐱","🐰","🐻","🦁","🐸"], mascotMsg:"Cố lên, sắp xong rồi!" },
    hard:   { size:9, boxH:3, boxW:3, remove:42, symbols:["1","2","3","4","5","6","7","8","9"], mascotMsg:"Thử thách dành cho bé thông minh!" }
  };

  let level = "easy";
  let cfg = LEVELS[level];
  let solution = [];
  let grid = [];
  let given = [];
  let selected = null;
  let mistakes = 0;
  let hintsLeft = 3;
  const MAX_CHECKS = 5;
  let checksLeft = MAX_CHECKS;
  let seconds = 0;
  let timerId = null;
  let won = false;

  const boardEl = document.getElementById("board");
  const paletteEl = document.getElementById("palette");
  const timerEl = document.getElementById("timer");
  const mistakesEl = document.getElementById("mistakes");
  const hintsLeftEl = document.getElementById("hintsLeft");
  const checksLeftEl = document.getElementById("checksLeft");
  const checkBtnEl = document.getElementById("checkBtn");
  const speechEl = document.getElementById("speech");
  const winOverlay = document.getElementById("winOverlay");
  const winStats = document.getElementById("winStats");

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  function isValidPlacement(g,size,boxH,boxW,r,c,val){
    for(let i=0;i<size;i++){
      if(g[r][i]===val) return false;
      if(g[i][c]===val) return false;
    }
    const br = Math.floor(r/boxH)*boxH;
    const bc = Math.floor(c/boxW)*boxW;
    for(let i=0;i<boxH;i++){
      for(let j=0;j<boxW;j++){
        if(g[br+i][bc+j]===val) return false;
      }
    }
    return true;
  }

  function fillGrid(g,size,boxH,boxW){
    for(let r=0;r<size;r++){
      for(let c=0;c<size;c++){
        if(g[r][c]===0){
          const nums = shuffle(Array.from({length:size},(_,i)=>i+1));
          for(const val of nums){
            if(isValidPlacement(g,size,boxH,boxW,r,c,val)){
              g[r][c] = val;
              if(fillGrid(g,size,boxH,boxW)) return true;
              g[r][c] = 0;
            }
          }
          return false;
        }
      }
    }
    return true;
  }

  function generatePuzzle(){
    const {size,boxH,boxW,remove} = cfg;
    const g = Array.from({length:size},()=>Array(size).fill(0));
    fillGrid(g,size,boxH,boxW);
    solution = g.map(row=>row.slice());

    const puzzle = g.map(row=>row.slice());
    const coords = [];
    for(let r=0;r<size;r++) for(let c=0;c<size;c++) coords.push([r,c]);
    shuffle(coords);
    for(let i=0;i<remove;i++){
      const [r,c] = coords[i];
      puzzle[r][c] = 0;
    }

    grid = puzzle.map(row=>row.slice());
    given = puzzle.map(row=>row.map(v=>v!==0));
  }

  function startTimer(){
    stopTimer();
    seconds = 0;
    timerEl.textContent = "00:00";
    timerId = setInterval(()=>{
      seconds++;
      const m = String(Math.floor(seconds/60)).padStart(2,"0");
      const s = String(seconds%60).padStart(2,"0");
      timerEl.textContent = `${m}:${s}`;
    },1000);
  }
  function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

  function symbolFor(val){
    if(val===0) return "";
    return cfg.symbols[val-1];
  }

  function renderBoard(){
    const {size,boxH,boxW} = cfg;
    const boxesAcross = size/boxW;
    const boxesDown = size/boxH;
    const cellSize = size<=4 ? 64 : size<=6 ? 52 : 38;
    const fontSize = size<=4?28:size<=6?22:18;

    boardEl.style.gridTemplateColumns = `repeat(${boxesAcross}, max-content)`;
    boardEl.style.gridTemplateRows = `repeat(${boxesDown}, max-content)`;
    boardEl.innerHTML = "";

    for(let boxRow=0; boxRow<boxesDown; boxRow++){
      for(let boxCol=0; boxCol<boxesAcross; boxCol++){
        const boxEl = document.createElement("div");
        boxEl.className = "box" + (((boxRow+boxCol)%2===1) ? " tint" : "");
        boxEl.style.gridTemplateColumns = `repeat(${boxW}, ${cellSize}px)`;
        boxEl.style.gridTemplateRows = `repeat(${boxH}, ${cellSize}px)`;

        for(let lr=0; lr<boxH; lr++){
          for(let lc=0; lc<boxW; lc++){
            const r = boxRow*boxH + lr;
            const c = boxCol*boxW + lc;
            const btn = document.createElement("button");
            btn.className = "cell";
            btn.style.fontSize = fontSize+"px";
            if(given[r][c]) btn.classList.add("given");
            btn.textContent = symbolFor(grid[r][c]);
            btn.dataset.r = r;
            btn.dataset.c = c;
            btn.addEventListener("click", ()=>selectCell(r,c));
            boxEl.appendChild(btn);
          }
        }
        boardEl.appendChild(boxEl);
      }
    }
    highlight();
  }

  function renderPalette(){
    paletteEl.innerHTML = "";
    cfg.symbols.forEach((sym,idx)=>{
      const b = document.createElement("button");
      b.className = "sym-btn";
      b.textContent = sym;
      b.addEventListener("click", ()=>placeValue(idx+1));
      paletteEl.appendChild(b);
    });
  }

  function selectCell(r,c){
    if(won) return;
    selected = {r,c};
    highlight();
  }

  function highlight(){
    const cells = boardEl.querySelectorAll(".cell");
    cells.forEach(cell=>{
      cell.classList.remove("selected","peer","sameval","wrong");
      const r = +cell.dataset.r, c = +cell.dataset.c;
      if(selected){
        const {size,boxH,boxW} = cfg;
        const sameRow = r===selected.r;
        const sameCol = c===selected.c;
        const br = Math.floor(r/boxH), sbr = Math.floor(selected.r/boxH);
        const bc = Math.floor(c/boxW), sbc = Math.floor(selected.c/boxW);
        const sameBox = br===sbr && bc===sbc;
        if(sameRow||sameCol||sameBox) cell.classList.add("peer");
        if(r===selected.r && c===selected.c) cell.classList.add("selected");
        const selVal = grid[selected.r][selected.c];
        if(selVal!==0 && grid[r][c]===selVal) cell.classList.add("sameval");
      }
    });
  }

  function placeValue(val){
    if(won || !selected) return;
    const {r,c} = selected;
    if(given[r][c]) return;
    grid[r][c] = val;
    renderBoard();
    selected = {r,c};
    highlight();

    const cellEl = boardEl.querySelector(`.cell[data-r='${r}'][data-c='${c}']`);
    if(val !== solution[r][c]){
      mistakes++;
      mistakesEl.textContent = mistakes;
      if(cellEl) cellEl.classList.add("wrong");
      speechEl.textContent = "Chưa đúng rồi, bé thử lại nhé!";
    } else {
      if(cellEl) cellEl.classList.add("correctflash");
      speechEl.textContent = "Chính xác, bé giỏi quá! 🎉";
      checkWin();
    }
  }

  function eraseCell(){
    if(won || !selected) return;
    const {r,c} = selected;
    if(given[r][c]) return;
    grid[r][c] = 0;
    renderBoard();
    selected = {r,c};
    highlight();
  }

  function useHint(){
    if(won) return;
    if(hintsLeft<=0){
      speechEl.textContent = "Bé hết lượt gợi ý rồi!";
      return;
    }
    const {size} = cfg;
    let target = null;
    if(selected && grid[selected.r][selected.c] !== solution[selected.r][selected.c]){
      target = selected;
    } else {
      const empties = [];
      for(let r=0;r<size;r++) for(let c=0;c<size;c++){
        if(grid[r][c] !== solution[r][c]) empties.push({r,c});
      }
      if(empties.length===0) return;
      target = empties[Math.floor(Math.random()*empties.length)];
    }
    grid[target.r][target.c] = solution[target.r][target.c];
    given[target.r][target.c] = false;
    hintsLeft--;
    hintsLeftEl.textContent = hintsLeft;
    renderBoard();
    const cellEl = boardEl.querySelector(`.cell[data-r='${target.r}'][data-c='${target.c}']`);
    if(cellEl){ cellEl.classList.add("hint","correctflash"); }
    selected = target;
    highlight();
    speechEl.textContent = "Đây là gợi ý cho bé nè!";
    checkWin();
  }

  function checkAll(){
    if(won) return;
    if(checksLeft<=0){
      speechEl.textContent = "Bé đã dùng hết lượt kiểm tra rồi, cố tự làm tiếp nhé!";
      return;
    }
    checksLeft--;
    checksLeftEl.textContent = checksLeft;
    if(checksLeft<=0) checkBtnEl.disabled = true;

    const {size} = cfg;
    let allFilled = true;
    let newMistakes = 0;
    for(let r=0;r<size;r++){
      for(let c=0;c<size;c++){
        if(grid[r][c]===0){ allFilled = false; continue; }
        if(grid[r][c] !== solution[r][c]) newMistakes++;
      }
    }
    renderBoard();
    for(let r=0;r<size;r++){
      for(let c=0;c<size;c++){
        if(grid[r][c] !== 0 && grid[r][c] !== solution[r][c]){
          const cellEl = boardEl.querySelector(`.cell[data-r='${r}'][data-c='${c}']`);
          if(cellEl) cellEl.classList.add("wrong");
        }
      }
    }
    if(newMistakes>0){
      mistakes += newMistakes;
      mistakesEl.textContent = mistakes;
      speechEl.textContent = `Có ${newMistakes} ô chưa đúng, bé xem lại nhé!`;
    } else if(!allFilled){
      speechEl.textContent = "Đúng hết rồi, bé điền tiếp nhé!";
    } else {
      checkWin();
    }
  }

  function checkWin(){
    const {size} = cfg;
    for(let r=0;r<size;r++) for(let c=0;c<size;c++){
      if(grid[r][c] !== solution[r][c]) return;
    }
    won = true;
    stopTimer();
    const m = String(Math.floor(seconds/60)).padStart(2,"0");
    const s = String(seconds%60).padStart(2,"0");
    winStats.textContent = `Hoàn thành trong ${m}:${s} với ${mistakes} lỗi`;
    winOverlay.classList.remove("hidden");
    launchConfetti();
  }

  function launchConfetti(){
    const emojis = ["🎉","🎊","⭐","🌟","🎈","🏆"];
    for(let i=0;i<28;i++){
      const span = document.createElement("span");
      span.className = "confetti";
      span.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      span.style.left = Math.random()*100 + "vw";
      const duration = 2.2 + Math.random()*1.6;
      span.style.animationDuration = duration+"s";
      span.style.animationDelay = (Math.random()*0.5)+"s";
      document.body.appendChild(span);
      setTimeout(()=>span.remove(), (duration+1)*1000);
    }
  }

  function newGame(){
    cfg = LEVELS[level];
    won = false;
    mistakes = 0;
    hintsLeft = 3;
    checksLeft = MAX_CHECKS;
    selected = null;
    mistakesEl.textContent = 0;
    hintsLeftEl.textContent = hintsLeft;
    checksLeftEl.textContent = checksLeft;
    checkBtnEl.disabled = false;
    winOverlay.classList.add("hidden");
    speechEl.textContent = cfg.mascotMsg;
    generatePuzzle();
    renderBoard();
    renderPalette();
    startTimer();
  }

  document.querySelectorAll(".tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
      tab.classList.add("active");
      level = tab.dataset.level;
      newGame();
    });
  });

  document.getElementById("newGameBtn").addEventListener("click", newGame);
  document.getElementById("hintBtn").addEventListener("click", useHint);
  document.getElementById("eraseBtn").addEventListener("click", eraseCell);
  document.getElementById("checkBtn").addEventListener("click", checkAll);
  document.getElementById("playAgainBtn").addEventListener("click", newGame);

  document.querySelector(`.tab[data-level="easy"]`).classList.add("active");
  newGame();
})();
</script>
</body>
</html>
